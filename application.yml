#Global Configuration for all the services
spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    registerWithEureka: true
    fetchRegistry: true
  instance:
    preferIpAddress: true
    leaseRenewalIntervalInSeconds: 10
    leaseExpirationDurationInSeconds: 30


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env,beans,httptrace
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: DEBUG
    com.loan: DEBUG